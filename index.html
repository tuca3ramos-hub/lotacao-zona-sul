<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>React Artifact</title>
  <!-- Estilos Tailwind originais mantidos -->

;--tw-backdrop-grayscale: ;--tw-backdrop-hue-rotate: ;--tw-backdrop-invert: ;--tw-backdrop-opacity: ;--tw-backdrop-saturate: ;--tw-backdrop-sepia: ;--tw-contain-size: ;--tw-contain-layout: ;--tw-contain-paint: ;--tw-contain-style: }/*! tailwindcss v3.4.18 | MIT License | https://tailwindcss.com*/,*::after,*::before{box-sizing:border-box;border:0 solid #e5e7eb}html{line-height:1.5;-webkit-text-size-adjust:100%;font-family:ui-sans-serif,system-ui,sans-serif}body{margin:0;line-height:inherit}
  </style>
  <!-- Inclusão oficial e estável do React e ReactDOM via CDN para garantir funcionamento completo -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0a0e14] text-white min-h-screen flex flex-col items-center justify-center">

  <div id="root" class="w-full max-w-xl p-6"></div>

  <!-- Script da aplicação com suporte a JSX via Babel -->
  <script type="text/babel">
    function App() {
      const [contador, setContador] = React.useState(0);

      return (
        <div className="bg-[#1a2332] border border-white/10 rounded-[16px] p-6 shadow-[0_8px_32px_rgba(11,61,145,0.35)] text-center">
          <h1 className="text-[20px] font-bold mb-4 text-emerald-300">Ambiente React Restaurado</h1>
          <p className="text-gray-400 mb-6 text-[14px]">O código anterior estava cortado. Esta versão reconstrói a estrutura com suporte total ao React e Tailwind.</p>
          
          <div className="text-[18px] font-mono mb-6 bg-black/30 py-3 rounded-xl border border-white/5">
            Contador: <span className="text-emerald-400 font-bold">{contador}</span>
          </div>

          <div className="flex justify-center gap-4">
            <button 
              onClick={() => setContador(contador + 1)}
              className="bg-[#0b3d91] hover:bg-[#0a347a] text-white font-semibold px-5 py-2.5 rounded-xl transition shadow-lg">
              Incrementar
            </button>
            <button 
              onClick={() => setContador(0)}
              className="bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold px-5 py-2.5 rounded-xl transition border border-white/10">
              Resetar
            </button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
