<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotação Zona Sul - Manaus</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX no browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // CONFIGURAÇÃO DO SUPABASE (Substitua pelas suas chaves reais do projeto Supabase)
        const SUPABASE_URL = "SUA_URL_DO_SUPABASE";
        const SUPABASE_ANON_KEY = "SUA_CHAVE_ANON_DO_SUPABASE";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function App() {
            const [abaAtiva, setAbaAtiva] = React.useState('passageiro'); // 'passageiro' ou 'motorista'
            
            // Estados do Passageiro
            const [viagens, setViagens] = React.useState([]);
            const [veiculoPosicao, setVeiculoPosicao] = React.useState(null);
            const [minhasReservas, setMinhasReservas] = React.useState([]);
            const [nomePassageiro, setNomePassageiro] = React.useState('');
            const [bairroPassageiro, setBairroPassageiro] = React.useState('Betânia');

            // Estados do Motorista
            const [motoristaLogadoId, setMotoristaLogadoId] = React.useState('a0000000-0000-0000-0000-000000000001'); // ID de teste criado no SQL
            const [statusGPS, setStatusGPS] = React.useState('Desativado');
            const [passageirosFila, setPassageirosFila] = React.useState([]);

            // Referência do Mapa Leaflet
            const mapRef = React.useRef(null);
            const markerCarroRef = React.useRef(null);

            // Inicializar Dados e Listeners em Tempo Real
            React.useEffect(() => {
                carregarViagens();
                carregarReservas();

                // Inscrever em tempo real na tabela de posicoes
                const posicaoSubscription = supabase
                    .channel('public:posicoes_veiculos')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'posicoes_veiculos' }, payload => {
                        if (payload.new) {
                            setVeiculoPosicao(payload.new);
                            atualizarMarcadorMapa(payload.new.lat, payload.new.lng);
                        }
                    })
                    .subscribe();

                return () => {
                    supabase.removeChannel(posicaoSubscription);
                };
            }, []);

            // Configurar Mapa Leaflet
            React.useEffect(() => {
                if (!mapRef.current) {
                    // Centralizado na Zona Sul de Manaus (ex: Betânia / Educandos)
                    const map = L.map('mapa-container').setView([-3.1350, -60.0120], 14);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: '&copy; OpenStreetMap'
                    }).addTo(map);
                    mapRef.current = map;
                }
            }, [abaAtiva]);

            const atualizarMarcadorMapa = (lat, lng) => {
                if (!mapRef.current) return;
                if (!markerCarroRef.current) {
                    const carIcon = L.divIcon({
                        html: '<div style="background-color: #ef4444; color: white; padding: 6px; border-radius: 50%; font-weight: bold; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.3);">🚗</div>',
                        className: 'custom-car-icon',
                        iconSize: [36, 36]
                    });
                    markerCarroRef.current = L.marker([lat, lng], { icon: carIcon }).addTo(mapRef.current);
                } else {
                    markerCarroRef.current.setLatLng([lat, lng]);
                }
                mapRef.current.panTo([lat, lng]);
            };

            // Funções de Banco de Dados
            const carregarViagens = async () => {
                const { data } = await supabase.from('viagens').select('*');
                if (data) setViagens(data);
            };

            const carregarReservas = async () => {
                const { data } = await supabase.from('reservas').select('*').order('criado_em', { ascending: false });
                if (data) {
                    setPassageirosFila(data);
                    setMinhasReservas(data);
                }
            };

            // AÇÃO DO PASSAGEIRO: Fazer Reserva (Garantia de Vaga)
            const solicitarReserva = async (viagemId) => {
                if (!nomePassageiro.trim()) {
                    alert('Por favor, informe seu nome para garantir a vaga.');
                    return;
                }

                const { error } = await supabase.from('reservas').insert([{
                    id_viagem: viagemId,
                    nome_passageiro: nomePassageiro,
                    bairro: bairroPassageiro,
                    lat: -3.1350,
                    lng: -60.0120,
                    x: 10.0,
                    y: 20.0,
                    vagas: 1,
                    status: 'reserva_criada'
                }]);

                if (error) {
                    alert('Erro ao realizar reserva: ' + error.message);
                } else {
                    alert('Vaga garantida com sucesso! Quem reserva, embarca.');
                    carregarReservas();
                }
            };

            // AÇÃO DO MOTORISTA: Ligar GPS Real do Celular
            const iniciarGPSReal = () => {
                if (!navigator.geolocation) {
                    alert('Seu navegador não suporta geolocalização GPS.');
                    return;
                }

                setStatusGPS('Ativo (Transmitindo GPS real)');
                alert('GPS ativado! O celular enviará sua posição real para os passageiros.');

                navigator.geolocation.watchPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;

                        // Envia para o Supabase
                        await supabase.from('posicoes_veiculos').insert([{
                            id_viagem: 'LOTACAO_ZS_01',
                            x: 10.0,
                            y: 20.0,
                            lat: lat,
                            lng: lng
                        }]);
                    },
                    (error) => {
                        console.error(error);
                        setStatusGPS('Erro no GPS: ' + error.message);
                    },
                    { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
                );
            };

            // AÇÃO DO MOTORISTA: Confirmar Embarque e Pagamento
            const registrarEmbarqueEComissao = async (reservaId, formaPagamento) => {
                const valorPassagem = 5.00;
                const comissaoPlataforma = 0.50;
                const valorLiquido = valorPassagem - comissaoPlataforma;

                // 1. Atualizar status da reserva para embarcado/finalizado
                await supabase.from('reservas').update({ status: 'finalizado' }).eq('id', reservaId);

                // 2. Registrar pagamento gerando a comissão da plataforma (R$ 0,50)
                const { error } = await supabase.from('pagamentos').insert([{
                    reserva_id: reservaId,
                    motorista_id: motoristaLogadoId,
                    valor_total: valorPassagem,
                    comissao_plataforma: comissaoPlataforma,
                    valor_liquido_motorista: valorLiquido,
                    forma_pagamento: formaPagamento
                }]);

                if (error) {
                    alert('Erro ao registrar pagamento: ' + error.message);
                } else {
                    alert(`Embarque confirmado! Pagamento via ${formaPagamento.toUpperCase()} registrado. Comissão da plataforma de R$ 0,50 computada.`);
                    carregarReservas();
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Cabeçalho */}
                    <header className="bg-blue-700 text-white p-4 shadow-md flex justify-between items-center">
                        <h1 className="text-lg font-bold">🚐 Lotação Zona Sul (Manaus)</h1>
                        <div className="space-x-2">
                            <button 
                                onClick={() => setAbaAtiva('passageiro')}
                                className={`px-3 py-1 rounded text-sm font-semibold ${abaAtiva === 'passageiro' ? 'bg-white text-blue-700' : 'bg-blue-800'}`}>
                                Passageiro
                            </button>
                            <button 
                                onClick={() => setAbaAtiva('motorista')}
                                className={`px-3 py-1 rounded text-sm font-semibold ${abaAtiva === 'motorista' ? 'bg-white text-blue-700' : 'bg-blue-800'}`}>
                                Motorista
                            </button>
                        </div>
                    </header>

                    {/* Conteúdo Principal */}
                    <main className="flex-1 flex flex-col md:flex-row">
                        {/* Mapa (Visível em ambas as abas) */}
                        <div className="w-full md:w-1/2 h-72 md:h-auto bg-gray-300 relative">
                            <div id="mapa-container" className="w-full h-full"></div>
                        </div>

                        {/* Painéis Dinâmicos */}
                        <div className="w-full md:w-1/2 p-4 overflow-y-auto bg-white">
                            {abaAtiva === 'passageiro' ? (
                                <div>
                                    <h2 className="text-xl font-bold text-gray-800 mb-4">📍 Encontre sua Lotação</h2>
                                    
                                    <div className="mb-4 bg-gray-50 p-3 rounded border">
                                        <label className="block text-sm font-medium text-gray-700">Seu Nome:</label>
                                        <input 
                                            type="text" 
                                            value={nomePassageiro} 
                                            onChange={(e) => setNomePassageiro(e.target.value)}
                                            placeholder="Ex: Maria da Silva" 
                                            className="w-full mt-1 p-2 border rounded"
                                        />
                                        <label className="block text-sm font-medium text-gray-700 mt-2">Bairro de Embarque:</label>
                                        <select value={bairroPassageiro} onChange={(e) => setBairroPassageiro(e.target.value)} className="w-full mt-1 p-2 border rounded">
                                            <option value="Betânia">Betânia</option>
                                            <option value="São Lázaro">São Lázaro</option>
                                            <option value="Educandos">Educandos</option>
                                            <option value="Centro">Centro</option>
                                        </select>
                                    </div>

                                    <h3 className="font-bold text-gray-700 mb-2">Rotas Ativas na Zona Sul:</h3>
                                    {viagens.map(v => (
                                        <div key={v.id} className="border p-4 rounded-lg shadow-sm mb-3 bg-white">
                                            <div className="flex justify-between items-center">
                                                <span className="font-bold text-blue-700">{v.nome_rota}</span>
                                                <span className="bg-green-100 text-green-800 text-xs px-2 py-1 rounded font-bold">R$ {v.valor_passagem}</span>
                                            </div>
                                            <p className="text-sm text-gray-600 mt-1">Sentido: {v.sentido}</p>
                                            <p className="text-sm text-gray-600">Vagas Máximas: {v.capacidade_maxima}</p>
                                            <button 
                                                onClick={() => solicitarReserva(v.id)}
                                                className="mt-3 w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-bold text-sm shadow">
                                                Reservar Vaga (Garantida)
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div>
                                    <h2 className="text-xl font-bold text-gray-800 mb-4">🚐 Painel do Motorista</h2>
                                    
                                    <div className="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-4">
                                        <p className="font-bold text-yellow-800">Status do GPS no Celular:</p>
                                        <p className="text-sm text-yellow-700">{statusGPS}</p>
                                        <button 
                                            onClick={iniciarGPSReal}
                                            className="mt-2 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded text-sm font-bold shadow">
                                            Ligar Transmissão de GPS Real
                                        </button>
                                    </div>

                                    <h3 className="font-bold text-gray-700 mb-2">Passageiros com Vaga Reservada:</h3>
                                    {passageirosFila.length === 0 ? (
                                        <p className="text-sm text-gray-500">Nenhuma reserva pendente no momento.</p>
                                    ) : (
                                        passageirosFila.map(p => (
                                            <div key={p.id} className="border p-3 rounded mb-2 bg-gray-50 flex justify-between items-center">
                                                <div>
                                                    <p className="font-bold text-gray-800">{p.nome_passageiro}</p>
                                                    <p className="text-xs text-gray-600">Bairro: {p.bairro} | Vagas: {p.vagas}</p>
                                                    <span className="text-xs bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-semibold">{p.status}</span>
                                                </div>
                                                <div className="space-x-1 flex">
                                                    <button 
                                                        onClick={() => registrarEmbarqueEComissao(p.id, 'pix')}
                                                        className="bg-teal-600 hover:bg-teal-700 text-white text-xs px-2.5 py-1.5 rounded font-bold">
                                                        Receber PIX
                                                    </button>
                                                    <button 
                                                        onClick={() => registrarEmbarqueEComissao(p.id, 'dinheiro')}
                                                        className="bg-amber-600 hover:bg-amber-700 text-white text-xs px-2.5 py-1.5 rounded font-bold">
                                                        Dinheiro
                                                    </button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
