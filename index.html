<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Lotação ZS - Uber Black</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#000;color:#fff;font-family:Inter,system-ui}
.leaflet-container{background:#111}
.uber-btn{background:#fff;color:#000;font-weight:700;padding:14px;border-radius:8px;width:100%}
.uber-card{background:#111;border:1px solid #222;border-radius:12px;padding:16px}
</style>
</head>
<body>
<div class="max-w-md mx-auto min-h-screen flex flex-col">
  <header class="p-4 flex justify-between items-center border-b border-zinc-800 sticky top-0 bg-black z-50">
    <b class="text-xl tracking-tight">LOTAÇÃO <span class="font-light">ZS</span></b>
    <span id="conn" class="text-[10px] bg-zinc-800 px-2 py-1 rounded">SYNC ●</span>
  </header>

  <div class="flex bg-zinc-900 m-3 rounded-lg p-1">
    <button id="tabP" class="flex-1 py-2 rounded-md bg-white text-black font-bold">PASSAGEIRO</button>
    <button id="tabM" class="flex-1 py-2 rounded-md text-zinc-400">MOTORISTA</button>
  </div>

  <!-- PASSAGEIRO -->
  <div id="viewP" class="flex-1 flex flex-col gap-3 p-3">
    <div id="mapP" class="h-[320px] rounded-xl overflow-hidden border border-zinc-800"></div>
    <div class="uber-card">
      <p class="text-xs text-zinc-400 mb-2">Clique no mapa onde você está esperando</p>
      <input id="nome" placeholder="Seu nome" class="w-full bg-black border border-zinc-800 rounded-lg p-3 mb-2 text-white">
      <div class="grid grid-cols-2 gap-2 mb-3">
        <select id="vagas" class="bg-black border border-zinc-800 rounded-lg p-3">
          <option value="1">1 vaga - R$5</option>
          <option value="2" selected>2 vagas - R$10</option>
          <option value="3">3 vagas - R$15</option>
          <option value="4">4 vagas - R$20</option>
        </select>
        <select id="bairro" class="bg-black border border-zinc-800 rounded-lg p-3">
          <option>Centro</option><option>Educandos</option><option>Betânia</option><option>Santa Luzia</option><option>Morro Liberdade</option><option>São Lázaro</option><option>Crespo</option>
        </select>
      </div>
      <div id="pontoInfo" class="text-[11px] text-zinc-500 mb-3">Nenhum ponto selecionado no mapa</div>
      <button id="btnReservar" class="uber-btn">RESERVAR VAGA GARANTIDA</button>
    </div>
    <div class="uber-card">
      <h3 class="font-bold mb-2">Minhas reservas</h3>
      <div id="listaP" class="space-y-2 text-sm"></div>
    </div>
    <div class="uber-card">
      <h3 class="font-bold mb-1">Carro do motorista</h3>
      <div id="carInfo" class="text-xs text-zinc-400">Aguardando motorista iniciar corrida...</div>
    </div>
  </div>

  <!-- MOTORISTA -->
  <div id="viewM" class="hidden flex-1 flex flex-col gap-3 p-3">
    <div id="mapM" class="h-[360px] rounded-xl overflow-hidden border border-zinc-800"></div>
    <div class="uber-card">
      <div class="flex justify-between items-center mb-2">
        <h3 class="font-bold">Painel motorista</h3>
        <span id="gpsStatus" class="text-[10px] text-zinc-500">GPS off</span>
      </div>
      <button id="btnGPS" class="uber-btn">INICIAR CORRIDA (LIGAR GPS REAL)</button>
      <div id="vagasMotorista" class="grid grid-cols-4 gap-2 mt-3"></div>
      <div id="logGPS" class="text-[10px] text-zinc-600 mt-2">-</div>
    </div>
    <div class="uber-card">
      <h3 class="font-bold mb-2">Próximos embarques (tempo real)</h3>
      <div id="listaM" class="space-y-2 text-sm">Nenhuma reserva ainda. Aguardando...</div>
    </div>
  </div>
</div>

<script>
const SUPA_URL="https://xpsnkdgzmljpwjhmontr.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhwc25rZGd6bWxqcHdqaG1vbnRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNTU0NTEsImV4cCI6MjEwMDYzMTQ1MX0.aVkhCnepgtpFPelVOV1fwXQnLXYjrQ53uqfWer71R4s";
const ID_VIAGEM="LOTACAO_ZS_01";
const supa = window.supabase.createClient(SUPA_URL, SUPA_KEY);

let mapP, mapM, markerPonto, markerCarP, markerCarM;
let pontoLatLng=null;
let reservas=[];
let posCar=null;

// MAPS DARK
const darkTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19});

function initMaps(){
  mapP = L.map('mapP').setView([-3.1319,-60.025],13);
  darkTiles.addTo(mapP);
  mapM = L.map('mapM').setView([-3.1319,-60.025],13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(mapM);

  mapP.on('click', e=>{
    pontoLatLng=e.latlng;
    if(markerPonto) mapP.removeLayer(markerPonto);
    markerPonto=L.marker(e.latlng,{icon:L.divIcon({html:'<div style="background:#fff;color:#000;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:bold">●</div>',className:''})}).addTo(mapP);
    document.getElementById('pontoInfo').innerText=`Ponto: ${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
  });
}
initMaps();

async function loadReservas(){
  const {data,error}=await supa.from('reservas').select('*').eq('id_viagem',ID_VIAGEM).order('created_at',{ascending:false});
  if(error){console.error(error); return;}
  reservas=data||[];
  renderReservas();
  renderPinsMotorista();
}
function renderReservas(){
  const lp=document.getElementById('listaP');
  const lm=document.getElementById('listaM');
  if(reservas.length===0){
    lp.innerHTML='<span class="text-zinc-500">Nenhuma reserva</span>';
    lm.innerHTML='<span class="text-zinc-500">Nenhuma reserva ainda. Aguardando passageiro reservar no PC...</span>';
    return;
  }
  lp.innerHTML=reservas.map(r=>`<div class="bg-zinc-900 p-2 rounded flex justify-between"><span>${r.nome} - ${r.vagas}v - ${r.bairro}</span><span class="text-[10px] px-2 py-1 rounded bg-white text-black">${r.status}</span></div>`).join('');
  lm.innerHTML=reservas.map(r=>`<div class="bg-zinc-900 p-3 rounded flex justify-between items-center"><div><b>${r.nome}</b> ${r.vagas}v - ${r.bairro}<br><span class="text-[11px] text-zinc-500">${r.lat.toFixed(4)},${r.lng.toFixed(4)} - ${r.status}</span></div><div class="flex gap-1">${r.status==='pendente'?`<button onclick="aceitar('${r.id}')" class="bg-white text-black px-3 py-1 rounded text-xs font-bold">Aceitar</button>`:''}${r.status==='aceita'?`<button onclick="embarcar('${r.id}')" class="bg-zinc-700 text-white px-3 py-1 rounded text-xs">Embarcou</button>`:''}</div></div>`).join('');
}
let motoristaMarkers=[];
function renderPinsMotorista(){
  motoristaMarkers.forEach(m=>mapM.removeLayer(m));
  motoristaMarkers=[];
  reservas.filter(r=>r.status!=='paga'&&r.status!=='cancelada').forEach(r=>{
    const m=L.marker([r.lat,r.lng],{icon:L.divIcon({html:`<div style="background:#fff;color:#000;border-radius:12px;padding:4px 8px;font-size:11px;font-weight:bold;border:2px solid #000">${r.nome} ${r.vagas}v</div>`,className:''})}).addTo(mapM).bindPopup(`${r.nome} - ${r.bairro} - ${r.vagas} vagas`);
    motoristaMarkers.push(m);
  });
}

window.aceitar=async(id)=>{
  await supa.from('reservas').update({status:'aceita'}).eq('id',id);
}
window.embarcar=async(id)=>{
  await supa.from('reservas').update({status:'embarcada'}).eq('id',id);
}

// REALTIME
supa.channel('res-all').on('postgres_changes',{event:'*',schema:'public',table:'reservas',filter:`id_viagem=eq.${ID_VIAGEM}`},payload=>{
  console.log('realtime reservas',payload);
  loadReservas();
}).subscribe();
supa.channel('pos-all').on('postgres_changes',{event:'*',schema:'public',table:'posicoes_veiculos',filter:`id_viagem=eq.${ID_VIAGEM}`},payload=>{
  const d=payload.new;
  if(!d) return;
  posCar=d;
  document.getElementById('carInfo').innerText=`Motorista: ${d.latitude.toFixed(5)}, ${d.longitude.toFixed(5)} - ${new Date().toLocaleTimeString()}`;
  if(!markerCarP){
    markerCarP=L.marker([d.latitude,d.longitude],{icon:L.divIcon({html:'<div style="background:#fff;width:18px;height:18px;border-radius:50%;border:3px solid #000"></div>',className:''})}).addTo(mapP);
  }else markerCarP.setLatLng([d.latitude,d.longitude]);
  if(!markerCarM){
    markerCarM=L.marker([d.latitude,d.longitude],{icon:L.divIcon({html:'<div style="background:#fff;width:18px;height:18px;border-radius:50%;border:3px solid #000"></div>',className:''})}).addTo(mapM);
  }else markerCarM.setLatLng([d.latitude,d.longitude]);
}).subscribe();

setInterval(async()=>{
  const {data}=await supa.from('posicoes_veiculos').select('*').eq('id_viagem',ID_VIAGEM).order('timestamp',{ascending:false}).limit(1).single();
  if(data) {
    posCar=data;
    document.getElementById('conn').innerText='SYNC ● LIVE';
    document.getElementById('conn').className='text-[10px] bg-green-600 px-2 py-1 rounded';
    document.getElementById('carInfo').innerText=`Motorista online: ${data.latitude.toFixed(5)}, ${data.longitude.toFixed(5)} - ${new Date(data.timestamp).toLocaleTimeString()}`;
    if(!markerCarP) markerCarP=L.marker([data.latitude,data.longitude]).addTo(mapP); else markerCarP.setLatLng([data.latitude,data.longitude]);
  }
},3000);

document.getElementById('btnReservar').onclick=async()=>{
  const nome=document.getElementById('nome').value.trim();
  const vagas=parseInt(document.getElementById('vagas').value);
  const bairro=document.getElementById('bairro').value;
  if(!nome){alert('Digite seu nome');return;}
  if(!pontoLatLng){alert('Clique no mapa onde você está');return;}
  const {error}=await supa.from('reservas').insert({nome,vagas,bairro,lat:pontoLatLng.lat,lng:pontoLatLng.lng,status:'pendente',id_viagem:ID_VIAGEM});
  if(error){alert('Erro: '+error.message);console.error(error);}
  else{alert('Reserva feita! Motorista vai ver seu pin agora');document.getElementById('nome').value='';}
};

document.getElementById('tabP').onclick=()=>{document.getElementById('viewP').classList.remove('hidden');document.getElementById('viewM').classList.add('hidden');document.getElementById('tabP').className='flex-1 py-2 rounded-md bg-white text-black font-bold';document.getElementById('tabM').className='flex-1 py-2 rounded-md text-zinc-400';setTimeout(()=>mapP.invalidateSize(),200);}
document.getElementById('tabM').onclick=()=>{document.getElementById('viewM').classList.remove('hidden');document.getElementById('viewP').classList.add('hidden');document.getElementById('tabM').className='flex-1 py-2 rounded-md bg-white text-black font-bold';document.getElementById('tabP').className='flex-1 py-2 rounded-md text-zinc-400';setTimeout(()=>mapM.invalidateSize(),200);}

let watchId=null;
document.getElementById('btnGPS').onclick=()=>{
  const btn=document.getElementById('btnGPS');
  if(watchId){
    navigator.geolocation.clearWatch(watchId);watchId=null;btn.innerText='INICIAR CORRIDA (LIGAR GPS REAL)';document.getElementById('gpsStatus').innerText='GPS off';return;
  }
  if(!navigator.geolocation){alert('GPS não suportado');return;}
  btn.innerText='GPS LIGADO - ENVIANDO...';
  document.getElementById('gpsStatus').innerText='GPS buscando...';
  watchId=navigator.geolocation.watchPosition(async pos=>{
    const {latitude,longitude,accuracy}=pos.coords;
    document.getElementById('gpsStatus').innerText=`GPS ${Math.round(accuracy)}m`;
    document.getElementById('logGPS').innerText=`Enviando: ${latitude.toFixed(5)},${longitude.toFixed(5)} - ${new Date().toLocaleTimeString()}`;
    await supa.from('posicoes_veiculos').insert({id_viagem:ID_VIAGEM,latitude,longitude,timestamp:new Date().toISOString(),vagas_ocupadas:0});
    if(!markerCarM) markerCarM=L.marker([latitude,longitude]).addTo(mapM); else markerCarM.setLatLng([latitude,longitude]);
    mapM.setView([latitude,longitude],15);
  },err=>{alert('Erro GPS: '+err.message)}, {enableHighAccuracy:true,maximumAge:0,timeout:10000});
};

// vagas visuais motorista
const vagasDiv=document.getElementById('vagasMotorista');
for(let i=0;i<4;i++){vagasDiv.innerHTML+=`<div class="h-12 bg-zinc-900 border border-zinc-700 rounded-lg flex items-center justify-center text-xs">Livre</div>`}

loadReservas();
</script>
</body>
</html>
